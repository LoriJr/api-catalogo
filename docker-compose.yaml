services:
  postgres:
    image: postgres:18
    container_name: postgres-catalogo-db
    ports:
      - "5410:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql
volumes:
  postgres_data: